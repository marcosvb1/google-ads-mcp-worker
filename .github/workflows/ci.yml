name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Catches a broken wrangler.jsonc or a module the Workers runtime cannot
      # bundle, without needing Cloudflare credentials.
      - name: Build (dry-run deploy)
        run: npx wrangler deploy --dry-run --outdir /tmp/build
